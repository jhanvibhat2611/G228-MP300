# MP300 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G228"          # your group id, e.g. "G042"
problem_id: "MP300"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: gb_from_monthly_bill           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: screen_hours
    group_value: Semi-urban
    factor: 60          # wrong value = right value x factor
  # No sentinel candidates or unexplained impossible repeated values found.
  sentinel_value:
    present: false
    column: null
    value: null
    count: null           # how many rows have it
  duplicate_rows:
    present: true
    count: 25           # number of EXTRA copies (rows you would delete)
  # Longest all-rows-constant run is one day in every numeric column.
  stuck_sensor:
    present: false
    column: null
    start_date: null
    end_date: null        # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 13           # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: phone_tier
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: G228-MP300-training
  best_run_id: bc82d6694d194f30b788bdcfc2ed5406
  registered_model_name: mp300_gb_per_day
  champion_version: 2

monitoring:
  psi:  # cleaned train.csv vs later.csv, up to 10 train quantile bins
    age: 0.02014478096060273
    screen_hours: 0.028974002024107843
    apps_installed: 0.030974680627314188
    plan_gb_limit: 2.2594929552838026
    video_minutes: 0.028683420540921684
    wifi_hours: 0.028086037826865275
  most_drifted_feature: plan_gb_limit
  mae_by_group:  # registered v1 on all later.csv rows
    'Urban': 0.34590717431835977
    'Semi-urban': 0.3133281695440838
    'Rural': 1.7645662187227251
  worst_served_group: Rural
  mae_v1_on_check: 0.7742215992018804  # shared last 30%
  mae_v2_on_check: 0.5727945150379006  # shared last 30%
  decision: promote
